# Dependabot owns this ecosystem's version updates. GitHub Actions
# version updates are owned by Renovate (renovate.json) — one bot per ecosystem.
#
# Security updates (GHSA/CVE) are not subject to cooldown or
# open-pull-requests-limit and still open immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 15
    groups:
      npm-otel-majors:
        applies-to: version-updates
        patterns:
          - "@opentelemetry/*"
          - "opentelemetry*"
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@opentelemetry/*"
          - "opentelemetry*"
        update-types:
          - "minor"
          - "patch"
      npm-majors:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@opentelemetry/*"
          - "opentelemetry*"
        update-types:
          - "major"
