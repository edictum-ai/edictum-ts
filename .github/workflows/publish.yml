name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  build:
    # No OIDC here: this job installs dependencies and runs the build.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sums-digest: ${{ steps.sums.outputs.digest }}
    steps:
      # Default ref: the release event's commit, the one the provenance names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the release commit to be on main and match the package version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          # Tags look like core-v0.5.0: the package dir, then -v, then its version.
          pkg="${TAG_NAME%-v*}"
          want="${TAG_NAME##*-v}"
          test -n "$pkg"
          test "$pkg" != "$TAG_NAME"
          test -f "packages/$pkg/package.json"
          have=$(node -p 'require("./packages/" + process.argv[1] + "/package.json").version' "$pkg")
          test "$have" = "$want"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build
      - run: pnpm -r test

      - name: Resolve workspace protocol references
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const versions = {};
            const pkgDirs = fs.readdirSync("packages").filter(d =>
              fs.existsSync(path.join("packages", d, "package.json"))
            );
            for (const d of pkgDirs) {
              const json = JSON.parse(fs.readFileSync(path.join("packages", d, "package.json"), "utf8"));
              versions[json.name] = json.version;
            }
            for (const d of pkgDirs) {
              const fp = path.join("packages", d, "package.json");
              const json = JSON.parse(fs.readFileSync(fp, "utf8"));
              let changed = false;
              for (const field of ["dependencies", "peerDependencies", "optionalDependencies", "devDependencies"]) {
                const deps = json[field];
                if (!deps) continue;
                for (const [name, version] of Object.entries(deps)) {
                  if (!String(version).startsWith("workspace:")) continue;
                  const resolved = versions[name];
                  if (!resolved) {
                    console.error("ERROR: " + fp + " " + field + "[" + name + "] = " + version + " but no workspace package found");
                    process.exit(1);
                  }
                  const protocol = version.replace("workspace:", "");
                  if (protocol === "*" || protocol === "^") deps[name] = "^" + resolved;
                  else if (protocol === "~") deps[name] = "~" + resolved;
                  else {
                    console.error("ERROR: unhandled workspace protocol: " + version);
                    process.exit(1);
                  }
                  changed = true;
                }
              }
              if (changed) {
                fs.writeFileSync(fp, JSON.stringify(json, null, 2) + "\n");
                console.log("Resolved workspace refs in " + fp);
              }
            }
          '

      - name: Verify no workspace refs remain
        run: |
          if grep -r '"workspace:' packages/*/package.json; then
            echo "ERROR: workspace: protocol references found in package.json files"
            exit 1
          fi
          echo "All workspace references resolved"

      - name: Pack packages
        run: |
          mkdir dist
          for pkg in core otel vercel-ai claude-sdk openai-agents langchain server; do
            (cd "packages/$pkg" && npm pack --pack-destination ../../dist)
          done

      - name: Record digests
        id: sums
        working-directory: dist
        run: |
          sha256sum ./*.tgz > SHA256SUMS
          echo "digest=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Verify the artifact is the one the build job produced
        working-directory: dist
        env:
          EXPECTED: ${{ needs.build.outputs.sums-digest }}
        run: |
          test -n "$EXPECTED"
          test "$(sha256sum SHA256SUMS | cut -d' ' -f1)" = "$EXPECTED"
          sha256sum --check --strict SHA256SUMS
          test "$(find . -mindepth 1 -printf "%P\n" | sort)" = "$( { cut -d' ' -f3 SHA256SUMS | sed 's|^\./||'; echo SHA256SUMS; } | sort)"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Publishing a packed tarball runs no package lifecycle scripts.
      - name: Publish all packages
        working-directory: dist
        run: |
          for tgz in ./*.tgz; do
            echo "Publishing $tgz..."
            output=$(npm publish "$tgz" --access public --provenance 2>&1) && echo "$output" || {
              exit_code=$?
              if echo "$output" | grep -qE "EPUBLISHCONFLICT|E409|already exists|cannot publish over"; then
                echo "Skipped $tgz (already published)"
              else
                echo "$output" >&2
                exit $exit_code
              fi
            }
          done
