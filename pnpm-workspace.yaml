packages:
  - 'packages/*'

# Dependency cooldown: resolve only versions published at least 15 days ago
# (21600 minutes), the same floor as Renovate's minimumReleaseAge.
minimumReleaseAge: 21600

# Advisory exceptions to the floor, each pinned to the exact version
# edictum-ts#198 moved to. Each group has an "Expires:" date, the day the
# floor admits the version. CI fails once that date is reached: delete the
# group, run `pnpm install --lockfile-only`, and confirm the lockfile doesn't
# change.
minimumReleaseAgeExclude:
  # GHSA-27r3-jxmh-p828, GHSA-v422-hmwv-36x6. Published 2026-10-22.
  # Expires: 2026-11-06
  - body-parser@2.4.0
  # The fast-uri advisories listed in edictum-ts#198. Published 2026-10-19.
  # Expires: 2026-11-03
  - fast-uri@3.1.9
